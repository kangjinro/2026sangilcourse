<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상일고 과목선택 도우미</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-shell">

  <!-- 헤더 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 6.5C10.5 5.3 8.2 4.6 5.5 4.5C4.7 4.47 4 5.1 4 5.9V17.4C4 18.15 4.6 18.77 5.35 18.8C7.9 18.9 10.2 19.55 12 20.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 6.5C13.5 5.3 15.8 4.6 18.5 4.5C19.3 4.47 20 5.1 20 5.9V17.4C20 18.15 19.4 18.77 18.65 18.8C16.1 18.9 13.8 19.55 12 20.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 6.5V20.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <strong>상일고 과목선택 도우미</strong>
          <span>2026학년도 입학생 교육과정 · 학과 · 진로 탐색</span>
        </div>
      </div>
      <div class="header-credit">배포: 상일고 진로쌤</div>
    </div>
    <nav class="tab-nav" id="tab-nav">
      <button class="tab-btn active" data-tab="dept-explore">학과탐색</button>
      <button class="tab-btn" data-tab="dept-univ">대학별 학과 탐색</button>
      <button class="tab-btn" data-tab="job-explore">직업탐색</button>
      <button class="tab-btn" data-tab="subject-explore">선택과목 탐색</button>
      <button class="tab-btn tab-btn-featured" data-tab="univ-recommend">대학별 권장과목 조회</button>
      <button class="tab-btn tab-btn-featured" data-tab="my-select">나의 과목선택</button>
    </nav>
  </header>

  <div class="app-body">
    <!-- 메인 컨텐츠 -->
    <main class="tab-content-wrap">
      <div id="loading-indicator" class="loading-indicator">
        <div class="spinner"></div>
        <p>데이터를 불러오는 중입니다…</p>
      </div>

      <section id="tab-dept-explore" class="tab-panel"></section>
      <section id="tab-dept-univ" class="tab-panel" hidden></section>
      <section id="tab-job-explore" class="tab-panel" hidden></section>
      <section id="tab-univ-recommend" class="tab-panel" hidden></section>
      <section id="tab-subject-explore" class="tab-panel" hidden></section>
      <section id="tab-my-select" class="tab-panel" hidden></section>
    </main>

    <!-- 나의 과목선택 탭 전용: 과목 선택 점검표 (가운데 열) -->
    <aside id="myselect-checklist-col" class="myselect-checklist-col" hidden></aside>

    <!-- 스크랩 사이드바 (대학별 권장과목 조회 / 나의 과목선택 탭에서만 표시) -->
    <aside id="scrap-sidebar" class="scrap-sidebar" hidden>
      <div class="scrap-sidebar-header">
        <h3>내 스크랩</h3>
      </div>
      <div id="scrap-list" class="scrap-list">
        <p class="scrap-empty">아직 스크랩한 항목이 없어요.<br>학과나 과목을 살펴보다가 마음에 드는 항목을 스크랩해보세요.</p>
      </div>
    </aside>
  </div>
</div>

<!-- 과목 소개 팝업(말풍선) -->
<div id="popup-overlay" class="popup-overlay" hidden>
  <div id="popup-box" class="popup-box">
    <button id="popup-close-btn" class="popup-close-btn" aria-label="닫기">✕</button>
    <div id="popup-content"></div>
  </div>
</div>

<!-- 엑셀 데이터를 미리 변환해 내장한 데이터 파일 (네트워크 요청 없이 즉시 로드) -->
<script src="js/data-embedded.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/store.js"></script>
<script src="js/scrap.js"></script>
<script src="js/tab-dept-explore.js"></script>
<script src="js/tab-dept-univ.js"></script>
<script src="js/tab-job-explore.js"></script>
<script src="js/tab-univ-recommend.js"></script>
<script src="js/tab-subject-explore.js"></script>
<script src="js/tab-my-select.js"></script>
<script src="js/app.js"></script>
</body>
</html>
